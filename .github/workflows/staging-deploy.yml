# Workflow name visible in GitHub Actions dashboard
name: Deploy Staging

# Trigger deployment whenever code is pushed to staging branch
on:
  push:
    branches:
      - staging

jobs:
  deploy:

    # GitHub temporary Linux runner
    runs-on: ubuntu-latest

    steps:

      # Step 1
      - name: 🚀 Start Staging Deployment
        run: echo "Starting deployment process..."

      # Step 2
      - name: 🔐 Connect To Staging Server And Deploy
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            echo "==============================="
            echo "Connected to staging server"
            echo "==============================="

            echo "Moving into staging project..."
            cd /home/zeronoticeperi/public_html/staging-project

            echo "Pulling latest code from GitHub staging branch..."
            git pull origin staging

            echo "Clearing Laravel caches..."
            php artisan optimize:clear

            echo "Running pending database migrations..."
            php artisan migrate --force || true

            echo "Deployment completed successfully."

      # Step 3
      - name: ✅ Deployment Finished
        run: echo "Staging deployment completed successfully."